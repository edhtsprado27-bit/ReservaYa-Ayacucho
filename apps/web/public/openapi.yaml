openapi: 3.0.3
info:
  title: ReservaYa Ayacucho · API REST
  version: 1.0.0
  description: |
    API REST del sistema de reservas de canchas sintéticas de la provincia de Huamanga.

    - **Implementación:** Route Handlers de Next.js (`apps/web/src/app/api/**/route.ts`), capa de presentación
      del monolito modular. Cada ruta llama a un caso de uso de `apps/web/src/modules/*/aplicacion`.
    - **Autenticación:** sesión de Supabase Auth guardada en cookies (`sb-<proyecto>-auth-token`). El navegador
      la envía sola después de iniciar sesión. La base de datos valida el rol de quien llama con `auth.uid()`.
    - **Errores:** todas las rutas responden `{ ok: false, codigo, error }` (las públicas de lectura, sin `ok`).
      `codigo` es estable; `error` es un mensaje para la persona.
    - **Anti doble reserva:** aunque dos pedidos lleguen a la vez, PostgreSQL (`EXCLUDE`) deja pasar solo uno;
      el otro recibe `409 HORARIO_OCUPADO`.
  license:
    name: Proyecto académico · Arquitectura de Software
  contact:
    name: ReservaYa Ayacucho
    url: https://github.com/edhtsprado27-bit/ReservaYa-Ayacucho
servers:
  - url: https://reservaya-ayacucho.vercel.app
    description: Producción (Vercel)
  - url: http://localhost:3000
    description: Desarrollo local
tags:
  - name: Catálogo
    description: Canchas publicadas, registro y aprobación (módulo catalogo)
  - name: Reservas
    description: Grilla de horarios, reservar, mis reservas y cancelar (módulo reservas)
  - name: Pagos
    description: Adelanto por Yape/Plin, lectura con IA y revisión del dueño (módulo pagos)
  - name: Dueño
    description: Agenda del día, reservas anotadas por el local, cobros en efectivo y bloqueos (módulo agenda)
  - name: Configuración del local
    description: Reglas de reserva, canchas, horario de atención y precios (módulo locales)
  - name: Administración
    description: Locales publicados, asignar el dueño real, suspender y reactivar (módulo locales, solo admin)
  - name: Usuarios
    description: Buscar cuentas, cambiar entre jugador y dueño, suspender y reactivar (módulo usuarios, solo admin)
  - name: Asistente
    description: Asistente de canchas (RF09). Las reglas o la IA (OpenRouter) interpretan el mensaje; las canchas y horas salen de la base de datos
  - name: Ayuda por WhatsApp
    description: Número de WhatsApp de ayuda de la plataforma (módulo soporte, RF15). Son enlaces wa.me, sin API de pago

paths:
  /api/canchas:
    get:
      tags: [Catálogo]
      summary: Canchas publicadas para el mapa
      description: Público. El CDN guarda la respuesta 60 s y el servidor 30 s en memoria (CatalogoEnCache).
      operationId: verCatalogo
      security: []
      responses:
        "200":
          description: Canchas aprobadas
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=60, stale-while-revalidate=300" }
          content:
            application/json:
              schema:
                type: object
                required: [canchas, total, generado]
                properties:
                  canchas: { type: array, items: { $ref: "#/components/schemas/Cancha" } }
                  total: { type: integer, example: 5 }
                  generado: { type: string, format: date-time }
        "500": { $ref: "#/components/responses/ErrorLectura" }
        "502": { $ref: "#/components/responses/ErrorLectura" }
    post:
      tags: [Catálogo]
      summary: Registrar una cancha (queda en revisión)
      description: Solo cuentas de dueño o administrador.
      operationId: registrarCancha
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaCancha" }
      responses:
        "201":
          description: Registrada, en revisión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistroCancha" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/canchas/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Catálogo]
      summary: Corregir una cancha que sigue en revisión
      description: Solo su dueño o el admin. Devuelve un id nuevo.
      operationId: corregirCancha
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaCancha" }
      responses:
        "200":
          description: Corregida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistroCancha" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Catálogo]
      summary: Quitar una cancha que sigue en revisión
      operationId: quitarCancha
      security: [{ sesion: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/canchas/mias:
    get:
      tags: [Catálogo]
      summary: Canchas en revisión que puedo ver
      description: Dueño, las suyas; admin, todas. Sin sesión devuelve una lista vacía.
      operationId: verPendientes
      security: [{ sesion: [] }, {}]
      responses:
        "200":
          description: Canchas en revisión
          content:
            application/json:
              schema:
                type: object
                properties:
                  canchas: { type: array, items: { $ref: "#/components/schemas/Cancha" } }
        "502": { $ref: "#/components/responses/ErrorLectura" }

  /api/admin/locales/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Catálogo]
      summary: Aprobar o rechazar una cancha
      description: Solo el administrador (lo verifica la base con fn_revisar_local). Al aprobar se renueva la caché del catálogo.
      operationId: revisarCancha
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [aprobar, rechazar] }
                motivo: { type: string, example: "La ubicación no corresponde al local" }
      responses:
        "200":
          description: Revisada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  id: { type: string, format: uuid }
                  nombre: { type: string }
                  estado: { type: string, example: approved }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Administración]
      summary: Asignar el dueño real, suspender o reactivar un local
      description: |
        - `asignar_dueno`: la persona debe tener cuenta en ReservaYa con ese correo; si era jugador, pasa a ser dueño.
        - `suspender`: sale del mapa y no recibe reservas nuevas (`motivo` obligatorio, lo ve el dueño).
          Las reservas que ya tenía siguen en pie.
        - `reactivar`: vuelve a publicarse.
        Cada cambio queda en `audit_logs`.
      operationId: gestionarLocal
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [asignar_dueno, suspender, reactivar] }
                correo: { type: string, format: email, description: "Obligatorio al asignar dueño" }
                motivo: { type: string, minLength: 3, maxLength: 300, description: "Obligatorio al suspender" }
      responses:
        "200":
          description: Hecho
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  local:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      slug: { type: string }
                      estado: { type: string, enum: [approved, suspended] }
                      dueno: { type: string, description: "Al asignar dueño" }
                      correo: { type: string, description: "Al asignar dueño" }
                      ahoraEsDueno: { type: boolean, description: "true si la cuenta era de jugador" }
                      reservasFuturas: { type: integer, description: "Al suspender o reactivar" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/admin/locales:
    get:
      tags: [Administración]
      summary: Locales publicados y suspendidos con su dueño (solo admin)
      operationId: listarLocalesAdmin
      security: [{ sesion: [] }]
      responses:
        "200":
          description: Lista de locales
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  locales:
                    type: array
                    items: { $ref: "#/components/schemas/LocalAdmin" }
        "403": { $ref: "#/components/responses/Error" }

  /api/admin/usuarios:
    get:
      tags: [Usuarios]
      summary: Buscar cuentas (solo admin)
      description: |
        Hasta 100 cuentas, las más recientes primero. No incluye la cuenta interna de la plataforma.
        La búsqueda compara el nombre (sin tildes), el correo y el celular (desde 3 dígitos).
      operationId: listarUsuarios
      security: [{ sesion: [] }]
      parameters:
        - name: buscar
          in: query
          schema: { type: string, maxLength: 80, example: "rosa" }
        - name: filtro
          in: query
          schema: { type: string, enum: [todos, jugadores, duenos, admins, suspendidos], default: todos }
      responses:
        "200":
          description: Lista de cuentas
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  usuarios:
                    type: array
                    items: { $ref: "#/components/schemas/UsuarioAdmin" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/admin/usuarios/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Usuarios]
      summary: Cambiar el rol, suspender o reactivar una cuenta (solo admin)
      description: |
        - `cambiar_rol`: entre `jugador` y `dueno`. Un dueño con locales a su nombre no pasa a jugador (`409 DUENO_CON_LOCALES`).
        - `suspender`: la cuenta no puede ingresar ni reservar; ve el `motivo` en /cuenta-suspendida. Sus reservas y
          locales siguen en pie (la respuesta dice cuántos tiene).
        - `reactivar`: vuelve a estar activa.
        Las cuentas de administrador no se cambian (`403 USUARIO_ES_ADMIN`). Cada cambio queda en `audit_logs`.
      operationId: gestionarUsuario
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [cambiar_rol, suspender, reactivar] }
                rol: { type: string, enum: [jugador, dueno], description: "Obligatorio al cambiar el rol" }
                motivo: { type: string, minLength: 3, maxLength: 300, description: "Obligatorio al suspender" }
      responses:
        "200":
          description: Hecho
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  usuario:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      rol: { type: string, enum: [jugador, dueno], description: "Al cambiar el rol" }
                      cambio: { type: boolean, description: "false si ya tenía ese rol" }
                      estado: { type: string, enum: [active, suspended], description: "Al suspender o reactivar" }
                      reservasFuturas: { type: integer }
                      localesPublicados: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/admin/ajustes:
    put:
      tags: [Ayuda por WhatsApp]
      summary: Guardar el WhatsApp de ayuda de la plataforma (solo admin)
      description: |
        Sale en el botón "Ayuda" de todas las páginas (enlace `https://wa.me/51<celular>`). Vacío o `null` lo quita.
        Se guarda como `+51` + 9 dígitos; al guardarlo se renueva la caché (`use cache`, etiqueta `ajustes-publicos`).
      operationId: guardarAjustesPlataforma
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [whatsappSoporte]
              properties:
                whatsappSoporte: { type: string, nullable: true, example: "966 123 456" }
      responses:
        "200":
          description: Guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  ajustes:
                    type: object
                    properties:
                      whatsappSoporte: { type: string, nullable: true, example: "+51966123456" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/asistente:
    post:
      tags: [Asistente]
      summary: Enviar un mensaje al asistente de canchas
      description: |
        Entiende búsquedas ("fútbol en Carmen Alto mañana a las 7") y dudas ("¿cómo pago el adelanto?").
        - Lo simple lo entienden **reglas** (`modo: reglas`), al instante y sin gastar IA.
        - Lo libre va a la **IA** de OpenRouter (`modo: ia`) solo con sesión y dentro del cupo diario
          (`fn_cupo_asistente`: 10 por cuenta y 30 por día, configurable). Si no hay cupo o la IA falla, responden las reglas y `aviso` lo explica.
        - Los locales, precios y horas libres salen SIEMPRE de la base de datos (catálogo publicado y grilla de cada local).
        Para seguir la conversación ("¿y a las 8?"), envía los `filtros` de la respuesta anterior y el `historial`.
        Máximo 20 mensajes por minuto por IP (`429 DEMASIADOS_MENSAJES`). No se guarda en caché.
      operationId: consultarAsistente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mensaje]
              properties:
                mensaje: { type: string, minLength: 1, maxLength: 500, example: "fútbol en Carmen Alto mañana a las 7" }
                filtros: { $ref: "#/components/schemas/FiltrosAsistente" }
                historial:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    properties:
                      rol: { type: string, enum: [persona, asistente] }
                      texto: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Respuesta del asistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  respuesta:
                    type: object
                    properties:
                      texto: { type: string, example: "Para mañana a las 19:00 encontré 1 local con canchas de fútbol en Carmen Alto y esa hora libre. Toca una hora para reservarla:" }
                      modo: { type: string, enum: [reglas, ia] }
                      aviso: { type: string, nullable: true }
                      filtros: { $ref: "#/components/schemas/FiltrosAsistente" }
                      entendido: { type: array, items: { type: string }, example: ["Fútbol", "Carmen Alto", "lun 23 nov", "19:00"] }
                      recomendaciones:
                        type: array
                        maxItems: 3
                        items: { $ref: "#/components/schemas/RecomendacionAsistente" }
                      sugerencias: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/disponibilidad:
    get:
      tags: [Reservas]
      summary: Grilla de horarios de un local en un día
      description: Pública, no dice quién reservó. El CDN la guarda 5 s.
      operationId: verDisponibilidad
      security: []
      parameters:
        - name: local
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: fecha
          in: query
          required: true
          description: Día en hora de Ayacucho (UTC-5)
          schema: { type: string, format: date, example: "2026-12-01" }
      responses:
        "200":
          description: Turnos del día
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=5, stale-while-revalidate=15" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  turnos: { type: array, items: { $ref: "#/components/schemas/Turno" } }
                  generado: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/ErrorLectura" }

  /api/reservas:
    get:
      tags: [Reservas]
      summary: Mis reservas
      description: Las vigentes primero. Sin sesión devuelve una lista vacía.
      operationId: verMisReservas
      security: [{ sesion: [] }, {}]
      responses:
        "200":
          description: Reservas de quien tiene la sesión
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  reservas: { type: array, items: { $ref: "#/components/schemas/Reserva" } }
    post:
      tags: [Reservas]
      summary: Reservar un horario (lo aparta mientras se paga el adelanto)
      description: |
        Llama a `fn_reservar`: en una transacción calcula el precio turno por turno, revisa el límite de 2 reservas
        por pagar y guarda la reserva. La restricción `EXCLUDE` impide cruces. Con la misma `clave` devuelve la misma
        reserva (idempotencia).
      operationId: reservarHorario
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoReserva" }
      responses:
        "201":
          description: Reserva apartada (Por pagar)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  reserva: { $ref: "#/components/schemas/ReservaCreada" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: Horario ocupado, cerrado o cancha sin tarifa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { ok: false, codigo: HORARIO_OCUPADO, error: "Alguien acaba de reservar ese horario. Elige otra hora: la grilla ya está actualizada." }
        "429": { $ref: "#/components/responses/Error" }

  /api/reservas/{id}/cancelar:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Reservas]
      summary: Cancelar una reserva propia
      operationId: cancelarReserva
      security: [{ sesion: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  conDevolucion: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/reservas/{id}/pago:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Pagos]
      summary: Enviar la captura del adelanto (Yape o Plin)
      description: |
        Sube la captura al bucket privado, la IA (OpenRouter) lee monto, n.º de operación, fecha y destinatario,
        y la base compara con lo esperado. La reserva pasa a "Pago en revisión". La IA nunca confirma el pago.
      operationId: enviarComprobante
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagen, metodo]
              properties:
                imagen: { type: string, format: binary, description: "JPG, PNG o WEBP de hasta 3 MB" }
                metodo: { type: string, enum: [yape, plin] }
      responses:
        "201":
          description: Comprobante recibido
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  pago: { type: string, format: uuid }
                  estadoPago: { type: string, enum: [submitted, ai_verified, ai_flagged] }
                  resultado: { $ref: "#/components/schemas/ResultadoLectura" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/pagos/{id}/revisar:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Pagos]
      summary: Confirmar o rechazar un pago (dueño del local o admin)
      operationId: revisarPago
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [confirmar, rechazar] }
                motivo: { type: string, maxLength: 200, description: "Obligatorio al rechazar" }
      responses:
        "200":
          description: Revisado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  estadoReserva: { type: string, example: confirmed }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/locales/{id}/pago:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Pagos]
      summary: Guardar el Yape, Plin y titular de un local
      operationId: guardarDatosPago
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                yape: { type: string, example: "966123456" }
                plin: { type: string, example: "966123456" }
                titular: { type: string, example: "Juan Pérez" }
      responses:
        "200":
          description: Guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  datos:
                    type: object
                    properties:
                      yape: { type: string, nullable: true }
                      plin: { type: string, nullable: true }
                      titular: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/dueno/agenda:
    get:
      tags: [Dueño]
      summary: Agenda de un día de un local (dueño del local o admin)
      description: |
        Devuelve las canchas con sus turnos y precios, las reservas activas o terminadas (con nombre y celular
        del jugador) y los bloqueos del día. Nunca se guarda en caché (`Cache-Control: private, no-store`).
      operationId: verAgendaDelDia
      security: [{ sesion: [] }]
      parameters:
        - name: local
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: fecha
          in: query
          required: true
          description: Día en hora de Lima (de 90 días atrás a 60 días adelante)
          schema: { type: string, format: date, example: "2026-11-20" }
      responses:
        "200":
          description: Agenda del día
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  agenda: { $ref: "#/components/schemas/AgendaDia" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/dueno/reservas:
    post:
      tags: [Dueño]
      summary: Anotar una reserva hecha por teléfono o en persona
      description: |
        Queda confirmada con origen `owner_manual`. El total se calcula con los precios de la cancha.
        Si `pagado` es mayor que 0 se registra un pago en efectivo. Puede ser de una hora que ya empezó
        (para anotar lo que pasó hoy). Choques con otra reserva o con un bloqueo → `409`.
      operationId: anotarReservaManual
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canchaId, inicio, fin, nombre]
              properties:
                canchaId: { type: string, format: uuid }
                inicio: { type: string, format: date-time }
                fin: { type: string, format: date-time }
                nombre: { type: string, minLength: 2, maxLength: 120, example: "Carlos Quispe" }
                telefono: { type: string, example: "966123456" }
                pagado: { type: number, minimum: 0, example: 30, description: "Efectivo recibido (0 a total)" }
                nota: { type: string, maxLength: 300 }
      responses:
        "201":
          description: Reserva anotada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  reserva:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      codigo: { type: string, example: "RY-7K2M9P" }
                      total: { type: number, example: 140 }
                      pagado: { type: number, example: 30 }
                      estado: { type: string, example: confirmed }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/dueno/reservas/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Dueño]
      summary: Cobrar, marcar si jugó o no vino, o cancelar una reserva
      description: |
        - `cobrar`: registra un pago en efectivo (`monto` de 0.01 hasta lo que falta). Si estaba por pagar, queda confirmada.
        - `jugo` / `no_vino`: solo cuando la hora ya empezó.
        - `cancelar`: solo antes de que termine; `motivo` es obligatorio y lo ve el jugador.
      operationId: gestionarReservaDelLocal
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [cobrar, jugo, no_vino, cancelar] }
                monto: { type: number, minimum: 0.01, description: "Obligatorio al cobrar" }
                motivo: { type: string, minLength: 3, maxLength: 200, description: "Obligatorio al cancelar" }
      responses:
        "200":
          description: Hecho
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  reserva:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      estado: { type: string, example: completed }
                      pagado: { type: number }
                      total: { type: number }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/dueno/bloqueos:
    post:
      tags: [Dueño]
      summary: Cerrar horas de una cancha (mantenimiento, torneo, evento)
      description: Los jugadores ven esas horas como cerradas. No se puede bloquear encima de reservas activas (`409 HAY_RESERVAS`).
      operationId: bloquearHorario
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canchaId, inicio, fin]
              properties:
                canchaId: { type: string, format: uuid }
                inicio: { type: string, format: date-time }
                fin: { type: string, format: date-time }
                motivo: { type: string, maxLength: 120, example: Mantenimiento }
      responses:
        "201":
          description: Horas cerradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  bloqueo:
                    type: object
                    properties:
                      id: { type: integer, example: 12 }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/dueno/bloqueos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      tags: [Dueño]
      summary: Volver a abrir horas bloqueadas
      operationId: quitarBloqueo
      security: [{ sesion: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/dueno/locales/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Configuración del local]
      summary: Reglas de reserva, canchas, horario y precios de un local (dueño del local o admin)
      operationId: verConfiguracionLocal
      security: [{ sesion: [] }]
      responses:
        "200":
          description: Configuración
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  config: { $ref: "#/components/schemas/ConfigLocal" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Configuración del local]
      summary: Guardar las reglas de reserva y el contacto del local
      description: Las reservas nuevas usan los valores nuevos; la ficha pública y el mapa se renuevan al instante.
      operationId: guardarAjustesLocal
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direccion, adelantoPct, minutosApartado, horasCancelacion]
              properties:
                direccion: { type: string, minLength: 5, maxLength: 200, example: "Jr. Lima 123" }
                referencia: { type: string, maxLength: 200 }
                whatsapp: { type: string, example: "966123456" }
                adelantoPct: { type: integer, minimum: 0, maximum: 100, example: 50 }
                minutosApartado: { type: integer, minimum: 10, maximum: 60, example: 15 }
                horasCancelacion: { type: integer, minimum: 0, maximum: 72, example: 6 }
      responses:
        "200":
          description: Guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  local: { $ref: "#/components/schemas/Cambio" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/dueno/locales/{id}/servicios:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Configuración del local]
      summary: Marcar los servicios del local (vestuarios, duchas, estacionamiento…)
      description: |
        Reemplaza la lista completa (`[]` = ninguno). Un código que no está en la lista responde `400 SERVICIO_INVALIDO`.
        La ficha pública y el catálogo del mapa (filtro "Con:") se renuevan al instante.
      operationId: guardarServiciosLocal
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servicios]
              properties:
                servicios:
                  type: array
                  items: { $ref: "#/components/schemas/CodigoServicio" }
                  example: [vestuarios, duchas, estacionamiento]
      responses:
        "200":
          description: Guardados
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  local:
                    allOf:
                      - $ref: "#/components/schemas/Cambio"
                      - type: object
                        properties:
                          servicios:
                            type: array
                            items: { $ref: "#/components/schemas/CodigoServicio" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/dueno/locales/{id}/canchas:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Configuración del local]
      summary: Agregar una cancha al local
      description: Empieza con horario de 08:00 a 23:00 todos los días. Máximo 10 canchas por local.
      operationId: agregarCancha
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, deporte, precio]
              properties:
                nombre: { type: string, minLength: 2, maxLength: 60, example: "Cancha 2" }
                deporte: { type: string, enum: [futbol, futsal, voley] }
                precio: { type: number, minimum: 1, maximum: 1000, example: 60 }
      responses:
        "201":
          description: Agregada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  cancha: { $ref: "#/components/schemas/Cambio" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/dueno/canchas/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Configuración del local]
      summary: Guardar nombre, deporte, horario por día y precios de una cancha
      description: |
        Los días que no vienen en `horario` quedan cerrados (`dia`: 0 = domingo … 6 = sábado; horas en punto o y media,
        `cierra` hasta `24:00`). Si cambian los precios, las reglas anteriores se desactivan (las reservas antiguas
        las siguen citando) y se crean "Normal" y "Hora punta" (desde `puntaDesde` hasta el cierre).
        Las reservas que quedan fuera del nuevo horario siguen en pie: se informan en `fueraDeHorario`.
      operationId: guardarCancha
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, deporte, maxMinutos, horario, precio]
              properties:
                nombre: { type: string, minLength: 2, maxLength: 60 }
                deporte: { type: string, enum: [futbol, futsal, voley] }
                techada: { type: boolean }
                maxMinutos: { type: integer, example: 180, description: "Múltiplo del turno, hasta 240" }
                horario:
                  type: array
                  maxItems: 7
                  items:
                    type: object
                    required: [dia, abre, cierra]
                    properties:
                      dia: { type: integer, minimum: 0, maximum: 6 }
                      abre: { type: string, example: "08:00" }
                      cierra: { type: string, example: "23:00" }
                precio: { type: number, minimum: 1, maximum: 1000, example: 60 }
                precioPunta: { type: number, nullable: true, example: 80 }
                puntaDesde: { type: string, nullable: true, example: "18:00" }
      responses:
        "200":
          description: Guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  cancha:
                    allOf:
                      - $ref: "#/components/schemas/Cambio"
                      - type: object
                        properties:
                          fueraDeHorario: { type: integer, example: 0 }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Configuración del local]
      summary: Dejar de ofrecer una cancha
      description: Solo si no tiene reservas pendientes (`409 CANCHA_CON_RESERVAS`) y no es la última del local (`409 ULTIMA_CANCHA`).
      operationId: quitarCancha
      security: [{ sesion: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: sb-auth-token
      description: Cookie de sesión de Supabase Auth (su nombre real es sb-<proyecto>-auth-token). El navegador la envía sola.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Ok:
      description: Operación correcta
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: true }
    Error:
      description: Error con código estable y mensaje para la persona
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ErrorLectura:
      description: Error en una ruta pública de lectura (sin el campo ok)
      content:
        application/json:
          schema:
            type: object
            required: [codigo, error]
            properties:
              codigo: { type: string, example: SIN_CONEXION }
              error: { type: string }

  schemas:
    Error:
      type: object
      required: [ok, codigo, error]
      properties:
        ok: { type: boolean, example: false }
        codigo: { type: string, example: DATOS_INVALIDOS }
        error: { type: string, example: "Faltan datos de la cancha (nombre, distrito y ubicación)." }

    Cancha:
      type: object
      required: [id, slug, nombre, distrito, direccion, lat, lng, deportes, techada]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: cancha-demo }
        nombre: { type: string, example: "Cancha Demo" }
        distrito: { type: string, example: "Carmen Alto" }
        direccion: { type: string }
        referencia: { type: string }
        lat: { type: number, example: -13.16 }
        lng: { type: number, example: -74.22 }
        deportes: { type: array, items: { type: string, enum: ["Fútbol", "Vóley", "Futsal"] } }
        techada: { type: boolean }
        precioDesde: { type: number, example: 50 }
        telefono: { type: string }
        rating: { type: number }
        totalResenas: { type: integer }
        servicios:
          type: array
          description: Servicios del local, en el orden de la lista
          items: { $ref: "#/components/schemas/CodigoServicio" }

    FiltrosAsistente:
      type: object
      nullable: true
      properties:
        distrito: { type: string, nullable: true, example: "Carmen Alto" }
        deporte: { type: string, nullable: true, enum: [Fútbol, Futsal, Vóley, null] }
        fecha: { type: string, format: date, nullable: true }
        hora: { type: string, nullable: true, example: "19:00" }
        franja: { type: string, nullable: true, enum: [manana, tarde, noche, null] }
        servicios: { type: array, items: { $ref: "#/components/schemas/CodigoServicio" } }
        techada: { type: boolean, nullable: true }
        precioMax: { type: number, nullable: true }
        nombre: { type: string, nullable: true }

    RecomendacionAsistente:
      type: object
      properties:
        slug: { type: string }
        nombre: { type: string }
        distrito: { type: string }
        precioDesde: { type: number, nullable: true }
        servicios: { type: array, items: { $ref: "#/components/schemas/CodigoServicio" } }
        deportes: { type: array, items: { type: string } }
        enlace: { type: string, example: "/cancha/complejo-los-andes?fecha=2026-11-23" }
        exacta: { type: boolean, description: "true si tiene libre justo la hora pedida" }
        horas:
          type: array
          maxItems: 4
          items:
            type: object
            properties:
              hora: { type: string, example: "19:00" }
              hasta: { type: string, example: "20:00" }
              cancha: { type: string, example: "Cancha 1" }
              precio: { type: number, nullable: true }
              enlace: { type: string, description: "Abre la grilla con esa hora ya elegida" }

    CodigoServicio:
      type: string
      enum: [vestuarios, duchas, banos, estacionamiento, cafeteria, tribuna, iluminacion, balon_incluido]

    NuevaCancha:
      type: object
      required: [nombre, distrito, lat, lng]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 120, example: "Complejo El Golazo" }
        distrito: { type: string, example: "Ayacucho" }
        lat: { type: number, example: -13.1601 }
        lng: { type: number, example: -74.2262 }
        direccion: { type: string }
        referencia: { type: string }
        deportes: { type: array, items: { type: string, enum: ["Fútbol", "Vóley", "Futsal"] } }
        techada: { type: boolean }
        precioDesde: { type: number, minimum: 1, maximum: 1000, example: 50 }
        telefono: { type: string }

    RegistroCancha:
      type: object
      properties:
        ok: { type: boolean, example: true }
        id: { type: string, format: uuid }
        slug: { type: string }
        estado: { type: string, example: pending_review }

    Turno:
      type: object
      properties:
        cancha: { type: string, format: uuid }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        estado: { type: string, enum: [libre, ocupado, pasado, cerrado] }
        precio: { type: number, nullable: true, example: 50 }

    PedidoReserva:
      type: object
      required: [canchaId, inicio, fin, clave]
      properties:
        canchaId: { type: string, format: uuid }
        inicio: { type: string, format: date-time, example: "2026-12-01T19:00:00-05:00" }
        fin: { type: string, format: date-time, example: "2026-12-01T21:00:00-05:00" }
        clave:
          type: string
          pattern: "^[A-Za-z0-9-]{8,64}$"
          description: Clave de idempotencia, una por intento (evita duplicados por doble clic)
          example: "7d0b9c1e-4f5a-4b7e-9c2d-1a2b3c4d5e6f"

    EstadoReserva:
      type: string
      enum: [pending_payment, payment_review, confirmed, completed, no_show, cancelled, expired]

    ReservaCreada:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string, example: RY-4K7P }
        estado: { $ref: "#/components/schemas/EstadoReserva" }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        total: { type: number, example: 120 }
        adelanto: { type: number, example: 60 }
        vence: { type: string, format: date-time, nullable: true, description: "Fin del apartado (15 min por defecto)" }

    Reserva:
      allOf:
        - $ref: "#/components/schemas/ReservaCreada"
        - type: object
          properties:
            pagado: { type: number }
            cancha: { type: string }
            deporte: { type: string }
            local: { type: string }
            slug: { type: string }
            distrito: { type: string }
            direccion: { type: string }
            referencia: { type: string, nullable: true }
            lat: { type: number, nullable: true }
            lng: { type: number, nullable: true }
            telefono: { type: string, nullable: true }
            horasCancelacion: { type: integer }
            cancelable: { type: boolean }

    ResultadoLectura:
      type: string
      nullable: true
      description: Comparación de lo que leyó la IA con lo esperado (null si la IA no pudo leer)
      enum: [match, amount_mismatch, recipient_mismatch, date_out_of_range, duplicate_operation, unreadable, null]

    AgendaDia:
      type: object
      properties:
        local:
          type: object
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string, example: "La Bombonera" }
            slug: { type: string }
            estado: { type: string, example: approved }
            adelantoPct: { type: number, example: 50 }
        fecha: { type: string, format: date }
        ahora: { type: string, format: date-time, description: Hora de la base de datos al armar la agenda }
        canchas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              nombre: { type: string, example: "Cancha 1" }
              deporte: { type: string, example: "Fútbol" }
              minutosTurno: { type: integer, example: 60 }
              turnos:
                type: array
                items:
                  type: object
                  properties:
                    inicio: { type: string, format: date-time }
                    fin: { type: string, format: date-time }
                    precio: { type: number, nullable: true }
        reservas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              codigo: { type: string }
              canchaId: { type: string, format: uuid }
              inicio: { type: string, format: date-time }
              fin: { type: string, format: date-time }
              estado: { type: string, enum: [pending_payment, payment_review, confirmed, completed, no_show] }
              origen: { type: string, enum: [web, mobile, chatbot, whatsapp, owner_manual] }
              jugador: { type: string, nullable: true }
              telefono: { type: string, nullable: true }
              total: { type: number }
              adelanto: { type: number }
              pagado: { type: number }
              vence: { type: string, format: date-time, nullable: true }
              nota: { type: string, nullable: true }
        bloqueos:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              canchaId: { type: string, format: uuid }
              inicio: { type: string, format: date-time }
              fin: { type: string, format: date-time }
              motivo: { type: string, nullable: true }

    Cambio:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, description: Slug del local (su ficha pública se renueva) }

    ConfigLocal:
      type: object
      properties:
        local:
          type: object
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            slug: { type: string }
            distrito: { type: string }
            estado: { type: string, enum: [approved, pending_review, suspended] }
